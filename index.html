<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sirius 과제 부스 · 3D 구성안</title>
    <meta name="description" content="Sirius 과제 부스를 도면 위치 그대로 컨퍼런스 룸에 두고, 입간판 안을 링크로 공유합니다." />
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body>
    <div id="stage">
      <div id="viewport"></div>
      <header id="topbar">
        <img src="./favicon.svg" width="36" height="36" alt="" />
        <div>
          <h1>Sirius 과제 부스</h1>
          <p>도면 위치는 고정입니다. 입간판 안을 바꿔 링크를 보냅니다.</p>
        </div>
      </header>
      <div id="toolbar">
        <div class="views">
          <button type="button" data-view="hero">3/4</button>
          <button type="button" data-view="front">정면</button>
          <button type="button" data-view="side">측면</button>
          <button type="button" data-view="top">평면</button>
          <button type="button" data-view="visitor">관람</button>
        </div>
        <div class="views">
          <button type="button" data-toggle="dims">치수</button>
          <button type="button" data-toggle="markup">마크업</button>
          <button type="button" data-toggle="person">사람 1.7m</button>
        </div>
      </div>
      <div id="toast" hidden></div>
    </div>
    <aside id="panel">
      <div class="panel-body">
        <p class="spec">폭 2.25 m · 깊이 0.75 m · 높이 2.25 m<br />선반 높이 1.00 m · 선반 깊이 0.50 m · 상단 그래픽 300 mm<br />55″ 왼쪽 · 32″ 모니터 왼쪽 세로 · 선반 수납</p>
        <p id="blurb"></p>

        <p class="k">입간판 · 우측</p>
        <div class="seg" data-key="sign">
          <button type="button" data-value="partner">파트너</button>
          <button type="button" data-value="user">사용자</button>
        </div>

        <p class="k">논의 메모</p>
        <textarea id="note" maxlength="140" rows="2" placeholder="이 구성에서 보고 싶은 점을 적으면 링크에 함께 실립니다."></textarea>
        <p id="note-count" class="count">0/140</p>
      </div>
      <div class="actions">
        <button type="button" id="copy-link" class="primary">이 구성 링크 복사</button>
        <button type="button" id="open-drawing">기준 도면</button>
        <button type="button" id="reset">도면 기본안</button>
      </div>
      <p class="hint">드래그 회전 · 스크롤 줌 · 우클릭 이동<br />1–5 시점 · D 치수 · M 도면 마크업 · H 패널 숨김<br />55″는 16:9 실치수 약 1.22 × 0.69 m. 화면의 숫자는 예시입니다.</p>
    </aside>

    <div id="lightbox" hidden>
      <figure>
        <img id="drawing-img" alt="부스 정면도, 측면도, 평면도" />
        <figcaption>기준 도면입니다. 주황 상자는 위치 표시이고 마감색이 아닙니다. 상단 그래픽은 2,250 × 300 mm Sirius 배너입니다.</figcaption>
        <button type="button" id="close-drawing">닫기</button>
      </figure>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
